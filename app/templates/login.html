<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כניסה מאובטחת · מערכת התורים</title>{% include "_design_system.html" %}</head>
<body><main class="auth-shell">
  <section class="auth-main">
    <header class="auth-top">{% include "_brand.html" %}<button id="theme-toggle" class="theme-toggle" type="button">מצב כהה</button></header>
    <div class="auth-content">
      <p class="eyebrow">STAFF ACCESS</p><h1>כניסה למערכת התורים</h1>
      {% if configured %}<div class="notice notice-success">Microsoft Authenticator הוגדר בהצלחה. אפשר להתחבר.</div>{% endif %}
      {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
      <form class="auth-form" method="post" action="/login">
        <div class="field"><label for="username">שם משתמש</label><input class="input" id="username" name="username" autocomplete="username" required></div>
        <div class="field"><label for="password">סיסמה</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="code">קוד Microsoft Authenticator</label><input class="input input-otp" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required><p class="hint">הקוד בן שש הספרות מתחלף בכל 30 שניות.</p></div>
        <button class="btn btn-primary" type="submit">כניסה מאובטחת</button>
      </form>
    </div>
  </section>
  <aside class="auth-side"><div class="auth-side-content" aria-hidden="true"></div></aside>
</main>{% include "_theme_script.html" %}</body></html>
